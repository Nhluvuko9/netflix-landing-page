<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">

    <title>Netflix South Africa - Watch TV Shows Online, Watch </title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <section id="navbar">
                <img src="./assets/logo.svg" alt="logo" id="netflix-logo">
                <button class="sign-in-btn">Sign In</button>
        </section>
        <div>
            <h1>Unlimited movies, TV shows, and more</h1>
            <h5>Starts at R 59. Cancel anytime.</h5>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
        </div>

        <section id="get-started">
            <input type="text" placeholder="Email address" class="email-input">
            <button class="get-started-btn">Get Started</button>
        </section>
    </header>

    <main>
        <h3>Trending Now</h3>

        <section id="trending-now">
            <div id="show1" class="cards">
                <span class="numbers">1</span>
            </div>
            <div id="show2" class="cards">
                <span class="numbers">2</span>
            </div>
            <div id="show3" class="cards">
                <span class="numbers">3</span>
            </div>
            <div id="show4" class="cards">
                <span class="numbers">4</span>
            </div>
        </section>

<!-- ----------------------------------------------------------- -->

        <h3>More Reasons To Join</h3>

        <section id="more-reasons">
            <div class="cards2"></div>
        </section>
    </main>
</body>
</html>
